[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uncropped-transformers"
version = "2026.0"
dependencies = [
    "tqdm",
    "torch",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "pyyaml",
    "einops",
    "h5py",
    "numba",
    "colorcet",
    "rotary-embedding-torch",
    "lightning",
    "optuna",
    "pandas",
    "trsfile==0.3.2",
    "captum",
    "pydantic",
]
requires-python = ">=3.11"
authors = [
    {name = "Jim Gammell", email = "jim@jimgammell.com"}
]
description = "Repository for training, hyperparameter tuning, and evaluation of transformers for full-key physical side-channel attacks on uncropped power/EM traces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "CITATION.cff"]

[project.optional-dependencies]
development = [
    "ruff",
    "pyright",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF022", "RUF046"]

[tool.pyright]
include = ["src"]
exclude = ["experiments"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
